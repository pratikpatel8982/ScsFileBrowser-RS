[package]
name = "scs-file-browser"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Browse and extract files from American Truck Simulator / Euro Truck Simulator 2 .scs archives without unpacking the whole archive"
license = "MIT"
readme = "README.md"
keywords = ["scs", "ets2", "ats", "archive", "hashfs"]
categories = ["filesystem", "games"]

[lib]
name = "scs_file_browser"
path = "src/lib.rs"

[[bin]]
name = "scs-file-browser"
path = "src/main.rs"
required-features = ["gui"]

[features]
default = ["gui"]
# The graphical front-end. Disable (`--no-default-features`) to build only the
# archive/virtual-filesystem library, e.g. for headless CI.
gui = ["dep:eframe", "dep:egui_extras", "dep:rfd"]

[dependencies]
flate2 = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dirs = "6"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

eframe = { version = "0.37", optional = true, default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "wayland",
    "x11",
] }
egui_extras = { version = "0.37", optional = true }
rfd = { version = "0.18", optional = true }

[dev-dependencies]
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
